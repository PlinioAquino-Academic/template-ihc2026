<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title"><title id="title">Mesa de inspeção revisada após OBS-01 a OBS-06</title><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#222}.title{font-size:24px;font-weight:bold}.small{font-size:16px}rect,line,path{stroke:#444;stroke-width:2;fill:white}.box{fill:#f6f6f6}.dash{stroke-dasharray:6 4}.mark{stroke:#222;stroke-width:3;fill:none}</style><rect width="1440" height="820" fill="white" stroke="none"/><text x="25" y="35" class="title">Mesa de inspeção | revisão de baixa fidelidade</text><text x="25" y="64" class="small">Caso DEMO-01 | Carga declarada: bobinas plásticas e peças automotivas [dados fictícios]</text><rect x="25" y="90" width="245" height="610" class=""/><text x="40" y="122" class="">Ajustes da imagem</text><text x="40" y="155" class="small">[H43] Controles candidatos</text><rect x="40" y="180" width="214" height="34" class=""/><text x="50" y="203" class="small">Restaurar visualização</text><rect x="40" y="235" width="214" height="34" class=""/><text x="50" y="258" class="small">Zoom / Contraste</text><rect x="40" y="290" width="214" height="34" class=""/><text x="50" y="313" class="small">Demais filtros: investigar</text><text x="40" y="408" class="small">Original preservado</text><text x="40" y="435" class="small">Necessidade de filtros</text><text x="40" y="462" class="small">a investigar com P01.</text><rect x="290" y="90" width="675" height="610" class=""/><text x="308" y="122" class="">Radiografia e comparação</text><rect x="308" y="145" width="240" height="34" class=""/><text x="318" y="168" class="small">Alternar mapa: oculto/visível</text><rect x="560" y="145" width="380" height="34" class=""/><text x="570" y="168" class="small">Vista: sobreposta / lado a lado [H30]</text><rect x="308" y="202" width="637" height="315" class="box"/><text x="330" y="238" class="small">Área da imagem de exemplo [esquema]</text><line x1="335" y1="265" x2="335" y2="485"/><line x1="379" y1="265" x2="379" y2="485"/><line x1="423" y1="265" x2="423" y2="485"/><line x1="467" y1="265" x2="467" y2="485"/><line x1="511" y1="265" x2="511" y2="485"/><line x1="555" y1="265" x2="555" y2="485"/><line x1="599" y1="265" x2="599" y2="485"/><line x1="643" y1="265" x2="643" y2="485"/><line x1="687" y1="265" x2="687" y2="485"/><line x1="731" y1="265" x2="731" y2="485"/><line x1="775" y1="265" x2="775" y2="485"/><line x1="819" y1="265" x2="819" y2="485"/><line x1="863" y1="265" x2="863" y2="485"/><rect x="710" y="330" width="130" height="100" class="mark"/><text x="715" y="352" class="">[1]</text><text x="308" y="552" class="small">Marcar região | editar | excluir</text><text x="308" y="585" class="small">Sem tecla pressionada para manter a comparação.</text><rect x="985" y="90" width="430" height="610" class=""/><text x="1000" y="122" class="title">Parecer técnico</text><text x="1000" y="156" class="small">Resultado do modelo: indício [exemplo]</text><text x="1000" y="182" class="small">Mapa: relevância aproximada; não prova ilícito.</text><rect x="1000" y="205" width="398" height="90" class=""/><text x="1012" y="231" class="small">Região 1 | Comentário:</text><text x="1012" y="261" class="small">Área de maior densidade a revisar.</text><text x="1000" y="329" class="">Conclusão da análise da imagem</text><rect x="1000" y="345" width="398" height="34" class=""/><text x="1010" y="368" class="small">Sem ressalvas na imagem / Suspeita apontada</text><rect x="1000" y="395" width="398" height="44" class=""/><text x="1012" y="423" class="small">Responsável fictício: Gustavo [obrigatório]</text><rect x="1000" y="452" width="398" height="70" class=""/><text x="1012" y="479" class="small">Justificativa: observação do analista</text><rect x="1000" y="540" width="398" height="34" class=""/><text x="1010" y="563" class="small">Revisar e exportar parecer em PDF</text><text x="1000" y="605" class="small">Omissão: indicar campo e manter dados.</text><text x="1000" y="633" class="small">Falha de exportação: tentar novamente.</text><text x="25" y="735" class="small">OBS-01 contexto | OBS-02 comparação persistente | OBS-03 limites do resultado | OBS-04 parecer técnico</text><text x="25" y="766" class="small">OBS-05 comentário visível | OBS-06 validação. P01 usa a Mesa; P02 recebe PDF externo; P03 é stakeholder.</text><text x="25" y="797" class="small">[H31/H37] Score/limiar não são requisitos; investigar utilidade e alternativas, inclusive não os apresentar.</text></svg>