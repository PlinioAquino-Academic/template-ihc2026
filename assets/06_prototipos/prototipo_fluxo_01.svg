<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1120" height="316" viewBox="0 0 1120 316">
<title id="title">Percursos da simulação de estoque</title><desc id="desc">Na reposição, consultar o produto, revisar a decisão e conferir o registro. Na conferência, confrontar as fontes, escolher correção ou pendência e comunicar o alcance. No cadastro, revisar o código duplicado.</desc>
<rect width="1120" height="316" fill="white"/><g font-family="Arial,sans-serif" fill="#21312b">
<text x="25" y="40" font-size="27" font-weight="bold">Percursos da simulação</text>
<g font-size="18" font-weight="bold"><text x="25" y="103">PF01 · Reposição</text><text x="25" y="184">PF02 · Conferência</text><text x="25" y="265">PF03 · Cadastro</text></g>
<g fill="#f0f3f2" stroke="#b3bdb9"><rect x="225" y="72" width="260" height="54" rx="5"/><rect x="525" y="72" width="260" height="54" rx="5"/><rect x="825" y="72" width="260" height="54" rx="5"/><rect x="225" y="153" width="260" height="54" rx="5"/><rect x="525" y="153" width="260" height="54" rx="5"/><rect x="825" y="153" width="260" height="54" rx="5"/><rect x="225" y="234" width="260" height="54" rx="5"/><rect x="525" y="234" width="260" height="54" rx="5"/><rect x="825" y="234" width="260" height="54" rx="5"/></g>
<g font-size="17" text-anchor="middle"><text x="355" y="105">P07-C → P08-R · Consultar</text><text x="655" y="105">P12 → P13 · Decidir e revisar</text><text x="955" y="105">P14 · Conferir o registro</text><text x="355" y="186">P15 · Comparar fontes</text><text x="655" y="186">P16C / P16P · Revisar</text><text x="955" y="186">P17C / P17P · Conferir alcance</text><text x="355" y="267">P03 · Identificar o produto</text><text x="655" y="267">P11 · Ler o erro de código</text><text x="955" y="267">P03 · Consultar o cadastro</text></g><g stroke="#424c48" fill="none" stroke-width="2"><path d="M490 99h28l-6 -5m6 5l-6 5"/><path d="M790 99h28l-6 -5m6 5l-6 5"/><path d="M490 180h28l-6 -5m6 5l-6 5"/><path d="M790 180h28l-6 -5m6 5l-6 5"/><path d="M490 261h28l-6 -5m6 5l-6 5"/><path d="M790 261h28l-6 -5m6 5l-6 5"/></g></g></svg>
