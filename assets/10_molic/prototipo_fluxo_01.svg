<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title"><title id="title">Fluxo de P01 na Mesa de inspeção</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs><style>text{font:18px Arial;fill:#222}rect{fill:white;stroke:#444;stroke-width:2}path{fill:none;stroke:#444;stroke-width:2;marker-end:url(#a)}.small{font-size:16px}</style><rect width="1280" height="600" fill="white" stroke="none"/><text x="25" y="38">Fluxos PF01/PF02 de P01 | referência de baixa fidelidade, sem decisão de P02 na Mesa</text><rect x="25" y="100" width="220" height="100"/><text x="40" y="133">PP01</text><text x="40" y="170">Abrir imagem</text><path d="M245 150H270"/><rect x="270" y="100" width="220" height="100"/><text x="285" y="133">PP02</text><text x="285" y="170">Consultar resultado</text><path d="M490 150H515"/><rect x="515" y="100" width="220" height="100"/><text x="530" y="133">PP03</text><text x="530" y="170">Comparar</text><path d="M735 150H760"/><rect x="760" y="100" width="220" height="100"/><text x="775" y="133">PP04</text><text x="775" y="170">Marcar e comentar</text><path d="M980 150H1005"/><rect x="1005" y="100" width="220" height="100"/><text x="1020" y="133">PP05</text><text x="1020" y="170">Concluir parecer</text><rect x="25" y="330" width="300" height="105"/><text x="40" y="363">PP06a | arquivo inválido</text><text x="40" y="400">Selecionar outro → PP01</text><path d="M135 200V330"/><path d="M25 380H10V90H135V100"/><rect x="700" y="330" width="525" height="105"/><text x="715" y="363">PP06b | campo ausente / falha na exportação</text><text x="715" y="400">Corrigir ou tentar novamente, preservando os dados</text><path d="M1115 200V330"/><path d="M810 330V245H870V200"/><path d="M1115 100V75H870V100"/><text x="882" y="68" class="small">Revisar região</text><text x="25" y="500">PF01: T01/T02. PF02: T03; uma análise sem região a registrar pode seguir de PP02/PP03 para PP05.</text><text x="25" y="535">Saída de PP05: PDF local. P02 lê externamente e formaliza o ato no despacho. Sem envio automático.</text><text x="25" y="570">H31/H37: score/limiar candidatos; sem calibração operacional demonstrada. P03 permanece stakeholder (H42).</text></svg>