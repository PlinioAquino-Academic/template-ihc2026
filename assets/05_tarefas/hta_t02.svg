<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <rect width="1500" height="900" fill="#ffffff"/>

  <text x="750" y="42" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="28"
        font-weight="bold" fill="#24292f">
    HTA — T02 Configurar parâmetros do experimento
  </text>

  <text x="750" y="72" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="17"
        fill="#57606a">
    P01 — Marina Ribeiro · C01 — Preparação e execução de experimentos
  </text>

  <rect x="500" y="105" width="500" height="78" rx="8"
        fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>

  <text x="750" y="136" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="18"
        font-weight="bold" fill="#24292f">
    0. Configurar parâmetros do experimento
  </text>

  <text x="750" y="163" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="15"
        fill="#57606a">
    Plano 0: 1 &gt; 2 &gt; 3 &gt; 4
  </text>

  <line x1="750" y1="183" x2="750" y2="220" stroke="#57606a" stroke-width="2"/>
  <line x1="200" y1="220" x2="1300" y2="220" stroke="#57606a" stroke-width="2"/>

  <line x1="200" y1="220" x2="200" y2="260" stroke="#57606a" stroke-width="2"/>
  <line x1="565" y1="220" x2="565" y2="260" stroke="#57606a" stroke-width="2"/>
  <line x1="930" y1="220" x2="930" y2="260" stroke="#57606a" stroke-width="2"/>
  <line x1="1300" y1="220" x2="1300" y2="260" stroke="#57606a" stroke-width="2"/>

  <rect x="55" y="260" width="290" height="78" rx="8"
        fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
  <text x="200" y="291" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="16"
        font-weight="bold" fill="#24292f">
    1. Identificar condições
  </text>
  <text x="200" y="318" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="14" fill="#57606a">
    Plano: 1.1 &gt; 1.2
  </text>

  <rect x="420" y="260" width="290" height="78" rx="8"
        fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
  <text x="565" y="291" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="16"
        font-weight="bold" fill="#24292f">
    2. Definir valores
  </text>
  <text x="565" y="318" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="14" fill="#57606a">
    Plano: 2.1 + 2.2 + 2.3
  </text>

  <rect x="785" y="260" width="290" height="78" rx="8"
        fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
  <text x="930" y="291" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="16"
        font-weight="bold" fill="#24292f">
    3. Verificar consistência
  </text>
  <text x="930" y="318" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="14" fill="#57606a">
    Plano: 3.1 &gt; 3.2 &gt; 3.3
  </text>

  <rect x="1155" y="260" width="290" height="78" rx="8"
        fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
  <text x="1300" y="291" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="16"
        font-weight="bold" fill="#24292f">
    4. Confirmar configuração
  </text>
  <text x="1300" y="318" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="14" fill="#57606a">
    Plano: 4.1 &gt; 4.2
  </text>

  <!-- Grupo 1 -->
  <line x1="200" y1="338" x2="200" y2="385" stroke="#57606a" stroke-width="2"/>
  <line x1="115" y1="385" x2="285" y2="385" stroke="#57606a" stroke-width="2"/>
  <line x1="115" y1="385" x2="115" y2="415" stroke="#57606a" stroke-width="2"/>
  <line x1="285" y1="385" x2="285" y2="415" stroke="#57606a" stroke-width="2"/>

  <rect x="35" y="415" width="160" height="90" fill="#ffffff" stroke="#57606a" stroke-width="3"/>
  <rect x="40" y="420" width="150" height="80" fill="none" stroke="#57606a"/>
  <text x="115" y="445" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">1.1</text>
  <text x="115" y="470" text-anchor="middle" font-family="Arial" font-size="11">Revisar cenário</text>
  <text x="115" y="488" text-anchor="middle" font-family="Arial" font-size="11">e demanda</text>

  <rect x="205" y="415" width="160" height="90" fill="#ffffff" stroke="#57606a" stroke-width="3"/>
  <rect x="210" y="420" width="150" height="80" fill="none" stroke="#57606a"/>
  <text x="285" y="445" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">1.2</text>
  <text x="285" y="470" text-anchor="middle" font-family="Arial" font-size="11">Identificar</text>
  <text x="285" y="488" text-anchor="middle" font-family="Arial" font-size="11">parâmetros</text>

  <!-- Grupo 2 -->
  <line x1="565" y1="338" x2="565" y2="385" stroke="#57606a" stroke-width="2"/>
  <line x1="445" y1="385" x2="685" y2="385" stroke="#57606a" stroke-width="2"/>
  <line x1="445" y1="385" x2="445" y2="415" stroke="#57606a" stroke-width="2"/>
  <line x1="565" y1="385" x2="565" y2="415" stroke="#57606a" stroke-width="2"/>
  <line x1="685" y1="385" x2="685" y2="415" stroke="#57606a" stroke-width="2"/>

  <rect x="385" y="415" width="120" height="90" fill="#ffffff" stroke="#57606a" stroke-width="3"/>
  <rect x="390" y="420" width="110" height="80" fill="none" stroke="#57606a"/>
  <text x="445" y="445" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">2.1</text>
  <text x="445" y="470" text-anchor="middle" font-family="Arial" font-size="10">Parâmetros</text>
  <text x="445" y="487" text-anchor="middle" font-family="Arial" font-size="10">gerais</text>

  <rect x="505" y="415" width="120" height="90" fill="#ffffff" stroke="#57606a" stroke-width="3"/>
  <rect x="510" y="420" width="110" height="80" fill="none" stroke="#57606a"/>
  <text x="565" y="445" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">2.2</text>
  <text x="565" y="470" text-anchor="middle" font-family="Arial" font-size="10">Condições</text>
  <text x="565" y="487" text-anchor="middle" font-family="Arial" font-size="10">de demanda</text>

  <rect x="625" y="415" width="120" height="90" fill="#ffffff" stroke="#57606a" stroke-width="3"/>
  <rect x="630" y="420" width="110" height="80" fill="none" stroke="#57606a"/>
  <text x="685" y="445" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">2.3</text>
  <text x="685" y="470" text-anchor="middle" font-family="Arial" font-size="10">Parâmetros</text>
  <text x="685" y="487" text-anchor="middle" font-family="Arial" font-size="10">comuns</text>

  <!-- Grupo 3 -->
  <line x1="930" y1="338" x2="930" y2="385" stroke="#57606a" stroke-width="2"/>
  <line x1="810" y1="385" x2="1050" y2="385" stroke="#57606a" stroke-width="2"/>
  <line x1="810" y1="385" x2="810" y2="415" stroke="#57606a" stroke-width="2"/>
  <line x1="930" y1="385" x2="930" y2="415" stroke="#57606a" stroke-width="2"/>
  <line x1="1050" y1="385" x2="1050" y2="415" stroke="#57606a" stroke-width="2"/>

  <rect x="750" y="415" width="120" height="90" fill="#ffffff" stroke="#57606a" stroke-width="3"/>
  <rect x="755" y="420" width="110" height="80" fill="none" stroke="#57606a"/>
  <text x="810" y="445" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">3.1</text>
  <text x="810" y="470" text-anchor="middle" font-family="Arial" font-size="10">Verificar</text>
  <text x="810" y="487" text-anchor="middle" font-family="Arial" font-size="10">completude</text>

  <rect x="870" y="415" width="120" height="90" fill="#ffffff" stroke="#57606a" stroke-width="3"/>
  <rect x="875" y="420" width="110" height="80" fill="none" stroke="#57606a"/>
  <text x="930" y="445" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">3.2</text>
  <text x="930" y="470" text-anchor="middle" font-family="Arial" font-size="10">Verificar</text>
  <text x="930" y="487" text-anchor="middle" font-family="Arial" font-size="10">validade</text>

  <rect x="990" y="415" width="120" height="90" fill="#ffffff" stroke="#57606a" stroke-width="3"/>
  <rect x="995" y="420" width="110" height="80" fill="none" stroke="#57606a"/>
  <text x="1050" y="445" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">3.3</text>
  <text x="1050" y="470" text-anchor="middle" font-family="Arial" font-size="10">Conferir</text>
  <text x="1050" y="487" text-anchor="middle" font-family="Arial" font-size="10">equivalência</text>

  <!-- Grupo 4 -->
  <line x1="1300" y1="338" x2="1300" y2="385" stroke="#57606a" stroke-width="2"/>
  <line x1="1215" y1="385" x2="1385" y2="385" stroke="#57606a" stroke-width="2"/>
  <line x1="1215" y1="385" x2="1215" y2="415" stroke="#57606a" stroke-width="2"/>
  <line x1="1385" y1="385" x2="1385" y2="415" stroke="#57606a" stroke-width="2"/>

  <rect x="1135" y="415" width="160" height="90" fill="#ffffff" stroke="#57606a" stroke-width="3"/>
  <rect x="1140" y="420" width="150" height="80" fill="none" stroke="#57606a"/>
  <text x="1215" y="445" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">4.1</text>
  <text x="1215" y="470" text-anchor="middle" font-family="Arial" font-size="11">Revisar configuração</text>
  <text x="1215" y="488" text-anchor="middle" font-family="Arial" font-size="11">consolidada</text>

  <rect x="1305" y="415" width="160" height="90" fill="#ffffff" stroke="#57606a" stroke-width="3"/>
  <rect x="1310" y="420" width="150" height="80" fill="none" stroke="#57606a"/>
  <text x="1385" y="445" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">4.2</text>
  <text x="1385" y="470" text-anchor="middle" font-family="Arial" font-size="11">Associar à</text>
  <text x="1385" y="488" text-anchor="middle" font-family="Arial" font-size="11">execução</text>

  <!-- Planos -->
  <rect x="90" y="605" width="1320" height="215" rx="12"
        fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>

  <text x="125" y="645" font-family="Arial" font-size="20"
        font-weight="bold" fill="#24292f">Planos</text>

  <text x="125" y="683" font-family="Arial" font-size="15" fill="#57606a">
    Plano 0: identificar condições &gt; definir valores &gt; verificar consistência &gt; confirmar configuração.
  </text>

  <text x="125" y="716" font-family="Arial" font-size="15" fill="#57606a">
    Se a verificação identificar inconsistência, retornar à definição dos valores.
  </text>

  <text x="125" y="749" font-family="Arial" font-size="15" fill="#57606a">
    As condições comuns precisam permanecer equivalentes entre execuções destinadas à comparação.
  </text>

  <text x="125" y="782" font-family="Arial" font-size="13" fill="#6e7781">
    Retângulo simples = objetivo · Retângulo duplo = operação
  </text>
</svg>
