<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1180" viewBox="0 0 1260 1180" role="img" aria-labelledby="title"><title id="title">Estados PP01–PP06, versão pós-walkthrough</title><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#222}.title{font-size:24px;font-weight:bold}.small{font-size:16px}rect,line,path{stroke:#444;stroke-width:2;fill:white}.box{fill:#f6f6f6}.dash{stroke-dasharray:6 4}.mark{stroke:#222;stroke-width:3;fill:none}</style><rect width="1260" height="1180" fill="white" stroke="none"/><text x="30" y="35" class="title">Mesa de inspeção | estados após o walkthrough</text><text x="30" y="62" class="small">[H] Proposta de baixa fidelidade para P01. Casos fictícios. Não é nova sessão de teste.</text><rect x="30" y="90" width="590" height="325" class=""/><text x="48" y="123" class="title">PP01 | sem imagem</text><rect x="48" y="145" width="554" height="40" class="box"/><text x="58" y="171" class="small">Abrir imagem / arrastar arquivo</text><rect x="48" y="193" width="554" height="40" class="box"/><text x="58" y="219" class="small">Caso ainda não selecionado</text><rect x="48" y="241" width="554" height="40" class="box"/><text x="58" y="267" class="small">Analisar fica indisponível</text><text x="48" y="330" class="small">Arquivo válido → PP02</text><text x="48" y="360" class="small">Inválido → PP06a → escolher outro → PP01</text><rect x="650" y="90" width="590" height="325" class=""/><text x="668" y="123" class="title">PP02 | resultado disponível</text><rect x="668" y="145" width="554" height="40" class="box"/><text x="678" y="171" class="small">Caso DEMO-01 | carga declarada visível</text><rect x="668" y="193" width="554" height="40" class="box"/><text x="678" y="219" class="small">Radiografia + mapa de atenção aproximado</text><rect x="668" y="241" width="554" height="40" class="box"/><text x="678" y="267" class="small">Resultado do modelo ≠ conclusão humana</text><text x="668" y="330" class="small">Comparar → PP03; Marcar → PP04</text><text x="668" y="360" class="small">Sem achado a marcar → PP05</text><rect x="30" y="440" width="590" height="325" class=""/><text x="48" y="473" class="title">PP03 | comparação</text><rect x="48" y="495" width="554" height="40" class="box"/><text x="58" y="521" class="small">Original [mapa oculto] | mapa [visível]</text><rect x="48" y="543" width="554" height="40" class="box"/><text x="58" y="569" class="small">Alternar mapa (estado persistente)</text><rect x="48" y="591" width="554" height="40" class="box"/><text x="58" y="617" class="small">Alternativa: Sobreposta / Lado a lado [H30]</text><text x="48" y="680" class="small">Marcar sem segurar tecla → PP04</text><text x="48" y="710" class="small">Exibir mapa novamente → PP02</text><rect x="650" y="440" width="590" height="325" class=""/><text x="668" y="473" class="title">PP04 | região e comentário</text><rect x="668" y="495" width="554" height="40" class="box"/><text x="678" y="521" class="small">Imagem: [1] região marcada pelo analista</text><rect x="668" y="543" width="554" height="40" class="box"/><text x="678" y="569" class="small">Região 1 | Comentário: área mais densa</text><rect x="668" y="591" width="554" height="40" class="box"/><text x="678" y="617" class="small">Editar / Excluir região e comentário</text><text x="668" y="680" class="small">Preencher conclusão → PP05</text><text x="668" y="710" class="small">Continuar exame → PP03</text><rect x="30" y="790" width="590" height="325" class=""/><text x="48" y="823" class="title">PP05 | conclusão da imagem</text><rect x="48" y="845" width="554" height="40" class="box"/><text x="58" y="871" class="small">Sem ressalvas na imagem / Suspeita apontada</text><rect x="48" y="893" width="554" height="40" class="box"/><text x="58" y="919" class="small">Responsável fictício | Justificativa</text><rect x="48" y="941" width="554" height="40" class="box"/><text x="58" y="967" class="small">Revisar caso, regiões e comentários</text><text x="48" y="1030" class="small">Exportar parecer → PDF local para P02</text><text x="48" y="1060" class="small">Campos ausentes → PP06b; falha → tentar novamente</text><rect x="650" y="790" width="590" height="325" class=""/><text x="668" y="823" class="title">PP06a / PP06b | erros e retorno</text><rect x="668" y="845" width="554" height="40" class="box"/><text x="678" y="871" class="small">Entrada: arquivo inválido, escolher outro</text><rect x="668" y="893" width="554" height="40" class="box"/><text x="678" y="919" class="small">Parecer: informar o campo que falta</text><rect x="668" y="941" width="554" height="40" class="box"/><text x="678" y="967" class="small">Exportação: falha; anotações mantidas</text><text x="668" y="1030" class="small">PP06a → PP01; PP06b → PP04/PP05</text><text x="668" y="1060" class="small">Corrigir e repetir exportação sem perder dados</text><text x="30" y="1160" class="small">H31/H37: score e limiar são candidatos a investigar, inclusive remoção. Decisão aduaneira fora da Mesa.</text></svg>