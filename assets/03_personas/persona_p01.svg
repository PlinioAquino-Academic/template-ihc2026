<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="760"
     viewBox="0 0 1200 760">

  <!-- Fundo -->
  <rect width="1200" height="760" fill="#f6f8fa"/>

  <!-- Cartão principal -->
  <rect x="30" y="30" width="1140" height="700" rx="18"
        fill="#ffffff"
        stroke="#d0d7de"
        stroke-width="2"/>

  <!-- Cabeçalho -->
  <path d="
    M48 30
    H1152
    A18 18 0 0 1 1170 48
    V180
    H30
    V48
    A18 18 0 0 1 48 30
    Z"
    fill="#24292f"/>

  <!-- Avatar -->
  <circle cx="125" cy="105" r="52" fill="#ffffff"/>

  <text x="125" y="116"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="32"
        font-weight="bold"
        fill="#24292f">
    MR
  </text>

  <!-- Identificação -->
  <text x="205" y="82"
        font-family="Arial, sans-serif"
        font-size="34"
        font-weight="bold"
        fill="#ffffff">
    Marina Ribeiro
  </text>

  <text x="205" y="118"
        font-family="Arial, sans-serif"
        font-size="20"
        fill="#d0d7de">
    Persona primária · Proto-persona a validar
  </text>

  <text x="205" y="149"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#d0d7de">
    Pesquisadora / Analista de Mobilidade Urbana
  </text>

  <!-- Coluna esquerda -->
  <text x="70" y="230"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="#24292f">
    Objetivo principal
  </text>

  <text x="70" y="268"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#57606a">
    Configurar experimentos e executar diferentes
  </text>

  <text x="70" y="296"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#57606a">
    estratégias de controle sob condições equivalentes.
  </text>

  <text x="70" y="324"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#57606a">
    Comparar seus resultados de forma confiável.
  </text>

  <!-- Necessidades -->
  <text x="70" y="385"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="#24292f">
    Necessidades
  </text>

  <text x="70" y="423"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#57606a">
    • Identificar cenário, parâmetros e estratégia.
  </text>

  <text x="70" y="453"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#57606a">
    • Acompanhar claramente o estado da simulação.
  </text>

  <text x="70" y="483"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#57606a">
    • Relacionar resultados às configurações utilizadas.
  </text>

  <text x="70" y="513"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#57606a">
    • Comparar métricas entre estratégias.
  </text>

  <!-- Divisor -->
  <line x1="600" y1="215" x2="600" y2="530"
        stroke="#d8dee4"
        stroke-width="2"/>

  <!-- Coluna direita -->
  <text x="650" y="230"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="#24292f">
    Dores / frustrações
  </text>

  <text x="650" y="268"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#57606a">
    • Excesso de parâmetros técnicos simultâneos.
  </text>

  <text x="650" y="298"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#57606a">
    • Configurações inconsistentes entre experimentos.
  </text>

  <text x="650" y="328"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#57606a">
    • Perda da relação entre configuração e resultado.
  </text>

  <text x="650" y="358"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#57606a">
    • Comparação trabalhosa entre várias execuções.
  </text>

  <!-- Contexto -->
  <text x="650" y="420"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="#24292f">
    Contexto de uso
  </text>

  <text x="650" y="458"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#57606a">
    Desktop ou notebook em ambiente acadêmico,
  </text>

  <text x="650" y="486"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#57606a">
    laboratorial ou profissional.
  </text>

  <!-- Rodapé -->
  <rect x="70" y="565"
        width="1060"
        height="115"
        rx="12"
        fill="#f6f8fa"
        stroke="#d8dee4"
        stroke-width="1.5"/>

  <text x="95" y="603"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="bold"
        fill="#24292f">
    Implicações para o design
  </text>

  <text x="95" y="638"
        font-family="Arial, sans-serif"
        font-size="16"
        fill="#57606a">
    Agrupar configurações, validar parâmetros, mostrar claramente o estado da execução
  </text>

  <text x="95" y="664"
        font-family="Arial, sans-serif"
        font-size="16"
        fill="#57606a">
    e manter rastreabilidade entre cenário, estratégia, execução e resultados.
  </text>

  <!-- Hipóteses -->
  <text x="938" y="708"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#6e7781">
    Hipóteses relacionadas: H01 · H02 · H03
  </text>

</svg>
