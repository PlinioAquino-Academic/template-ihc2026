  </text>

  <text x="650" y="298"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#57606a">
    • Resultados apresentados sem contexto experimental.
  </text>

  <text x="650" y="328"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#57606a">
