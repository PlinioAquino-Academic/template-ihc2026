  </text>

  <text x="650" y="358"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#57606a">
    • Dificuldade de identificar diferenças relevantes.
  </text>

  <text x="650" y="420"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="#24292f">
