  </text>

  <text x="70" y="324"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#57606a">
    Utilizar evidências para apoiar avaliações e decisões.
  </text>

  <text x="70" y="385"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="#24292f">
    Necessidades
  </text>

  <text x="70" y="423"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#57606a">
    • Visualizar as principais métricas de forma consolidada.
  </text>

  <text x="70" y="453"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#57606a">
    • Comparar estratégias e cenários.
  </text>

  <text x="70" y="483"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#57606a">
    • Identificar as condições relacionadas aos resultados.
  </text>

  <text x="70" y="513"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#57606a">
    • Consultar detalhes somente quando necessário.
  </text>

  <line x1="600" y1="215" x2="600" y2="530"
        stroke="#d8dee4"
        stroke-width="2"/>

  <text x="650" y="230"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="#24292f">
    Dores / frustrações
  </text>

  <text x="650" y="268"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#57606a">
