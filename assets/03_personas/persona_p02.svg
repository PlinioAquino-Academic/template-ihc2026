  </text>

  <text x="70" y="268"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#57606a">
    Compreender o desempenho das estratégias de controle
  </text>

  <text x="70" y="296"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#57606a">
