<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1140" viewBox="0 0 1560 1140" role="img" aria-labelledby="title"><title id="title">Mapa de objetivos finais e instrumentais com papéis e relações de instrumentação</title><style>text{font:17px Arial;fill:#222}.title{font-size:27px;font-weight:bold}.small{font-size:15px}.edge{stroke:#555;fill:none;stroke-width:1.5;marker-end:url(#arrow)}.box{fill:white;stroke:#222;stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs><rect width="1560" height="1140" fill="white"/><text x="30" y="38" class="title">Objetivos humanos apoiados pela análise e pelo parecer</text><text x="30" y="70">Título agregador, sem objetivo raiz. Setas significam instrumentação, não sequência ou decomposição.</text><rect x="30" y="110" width="480" height="140" class="box"/><text x="45" y="138">O02 | Instrumental direto</text><text x="45" y="167">Conferir correspondência</text><text x="45" y="192">entre caso e evidência</text><text x="45" y="231" class="small">Papel: P01/P02</text><rect x="540" y="110" width="480" height="140" class="box"/><text x="555" y="138">O03 | Instrumental direto</text><text x="555" y="167">Confrontar evidências</text><text x="555" y="192">para esclarecer a dúvida</text><text x="555" y="231" class="small">Papel: P01</text><rect x="1050" y="110" width="480" height="140" class="box"/><text x="1065" y="138">O04 | Instrumental direto</text><text x="1065" y="167">Descrever e localizar</text><text x="1065" y="192">o achado observado</text><text x="1065" y="231" class="small">Papel: P01</text><rect x="285" y="295" width="480" height="140" class="box"/><text x="300" y="323">O07 | Instrumental direto</text><text x="300" y="352">Relacionar o achado</text><text x="300" y="377">com o contexto da carga</text><text x="300" y="416" class="small">Papel: P01/P02</text><rect x="795" y="295" width="480" height="140" class="box"/><text x="810" y="323">O08 | Instrumental direto</text><text x="810" y="352">Reconhecer limites e</text><text x="810" y="377">informação insuficiente</text><text x="810" y="416" class="small">Papel: P01/P02</text><rect x="540" y="545" width="480" height="140" class="box" stroke-dasharray="7 5"/><text x="555" y="573">O05 | Instrumental indireto</text><text x="555" y="602">Comunicar conclusão rastreável</text><text x="555" y="627">a quem decidirá</text><text x="555" y="666" class="small">Papel: P01</text><ellipse cx="270" cy="925" rx="235" ry="85" class="box"/><text x="85" y="886">O01 | Final | P01</text><text x="85" y="918">Concluir de forma fundamentada</text><text x="85" y="943">a análise da imagem</text><text x="85" y="974" class="small">Na Mesa: P01</text><ellipse cx="780" cy="925" rx="235" ry="85" class="box" stroke-dasharray="7 5"/><text x="595" y="886">O06 | Final externo | P02</text><text x="595" y="918">Decidir sobre a carga</text><text x="595" y="943">com fundamento</text><text x="595" y="974" class="small">Fora da Mesa: destinatário externo</text><ellipse cx="1290" cy="925" rx="235" ry="85" class="box" stroke-dasharray="7 5"/><text x="1105" y="886">O09 | Final externo | P03</text><text x="1105" y="918">Esclarecer a suspeita</text><text x="1105" y="943">na conferência física</text><text x="1105" y="974" class="small">Fora da Mesa: destinatário externo</text><path d="M525 435 L525 470 L1035 470 L1035 435" class="edge"/><text x="350" y="497" class="small">O07/O08 instrumentam O01, O06 e O09 (papéis em cada nó).</text><path d="M420 470 L420 775 L270 775 L270 840" class="edge"/><text x="185" y="800" class="small">instrumenta</text><path d="M1110 470 L1110 775 L780 775 L780 840" class="edge"/><text x="695" y="800" class="small">instrumenta</text><path d="M1110 470 L1110 775 L1290 775 L1290 840" class="edge"/><text x="1205" y="800" class="small">instrumenta</text><path d="M270 250 L45 250 L45 820 L180 820 L180 850" class="edge"/><text x="48" y="515" class="small">O02 → O01/O06/O09</text><text x="48" y="540" class="small">instrumenta</text><path d="M780 250 L650 270 L650 295" class="edge"/><text x="615" y="270" class="small">O03 instrumenta O01</text><path d="M1290 250 L1515 250 L1515 720 L270 720 L270 840" class="edge"/><text x="1180" y="742" class="small">O04 instrumenta O01</text><path d="M1290 250 L1290 520 L1020 520 L1020 600" class="edge"/><text x="1120" y="517" class="small">O04 instrumenta O05</text><path d="M780 685 L780 760 L780 760 L780 840" class="edge" stroke-dasharray="7 5"/><path d="M780 685 L780 760 L1290 760 L1290 840" class="edge" stroke-dasharray="7 5"/><text x="640" y="709" class="small">O05 instrumenta indiretamente O06/O09</text><text x="30" y="1055">Legenda: elipse = final; retângulo = instrumental direto; retângulo tracejado = instrumental indireto.</text><text x="30" y="1085">Final tracejado = realização externa. P03 é stakeholder, sem tela própria; a posição radiográfica não é coordenada física.</text><text x="30" y="1115">O02 também instrumenta O06/O09; O03 instrumenta O01 diretamente. Fonte editável e todas as relações: mapa_objetivos.mmd.</text></svg>