<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1300" viewBox="0 0 1500 1300" role="img" aria-labelledby="title"><title id="title">Mapa de objetivos finais e instrumentais, por papel</title><style>text{font:17px Arial;fill:#222}.title{font-size:26px;font-weight:bold}.small{font-size:15px}.box{fill:white;stroke:#222;stroke-width:2}.edge{fill:none;stroke:#555;stroke-width:1.8;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs><rect width="1500" height="1300" fill="white"/><text x="25" y="35" class="title">Mapa de objetivos finais e instrumentais, por papel</text><text x="25" y="65">Seta sai do objetivo que apoia e chega ao objetivo apoiado. Relação “instrumenta”, sem ordem de execução.</text><text x="25" y="92">Cada coluna é uma vista por objetivo final. Um ID repetido é o mesmo objetivo compartilhado, sem nova funcionalidade.</text><ellipse cx="250" cy="195" rx="208" ry="75" class="box"/><text x="250" y="170" text-anchor="middle">O01 | Final | P01</text><text x="250" y="198" text-anchor="middle">Concluir de forma fundamentada</text><text x="250" y="223" text-anchor="middle">a análise da imagem</text><text x="250" y="250" text-anchor="middle" class="small">No recorte da Mesa</text><rect x="80" y="330" width="345" height="100" class="box"/><text x="95" y="353" class="small">O02 | Instrumental direto | P01/P02</text><text x="95" y="380">Conferir correspondência</text><text x="95" y="405">entre caso e evidência</text><path d="M80 380 L30 380 L30 195 L42 195" class="edge"/><text x="85" y="318" class="small">instrumenta O01</text><rect x="80" y="470" width="345" height="100" class="box"/><text x="95" y="493" class="small">O03 | Instrumental direto | P01</text><text x="95" y="520">Confrontar evidências</text><text x="95" y="545">para esclarecer a dúvida</text><path d="M80 520 L37 520 L37 195 L42 195" class="edge"/><text x="85" y="458" class="small">instrumenta O01</text><rect x="80" y="610" width="345" height="100" class="box"/><text x="95" y="633" class="small">O04 | Instrumental direto | P01</text><text x="95" y="660">Descrever e localizar</text><text x="95" y="685">o achado observado</text><path d="M80 660 L44 660 L44 195 L42 195" class="edge"/><text x="85" y="598" class="small">instrumenta O01</text><rect x="80" y="750" width="345" height="100" class="box"/><text x="95" y="773" class="small">O07 | Instrumental direto | P01/P02</text><text x="95" y="800">Relacionar o achado</text><text x="95" y="825">com o contexto da carga</text><path d="M80 800 L51 800 L51 195 L42 195" class="edge"/><text x="85" y="738" class="small">instrumenta O01</text><rect x="80" y="890" width="345" height="100" class="box"/><text x="95" y="913" class="small">O08 | Instrumental direto | P01/P02</text><text x="95" y="940">Reconhecer limites e</text><text x="95" y="965">informação insuficiente</text><path d="M80 940 L58 940 L58 195 L42 195" class="edge"/><text x="85" y="878" class="small">instrumenta O01</text><ellipse cx="750" cy="195" rx="208" ry="75" class="box" stroke-dasharray="7 5"/><text x="750" y="170" text-anchor="middle">O06 | Final | P02</text><text x="750" y="198" text-anchor="middle">Decidir sobre a carga</text><text x="750" y="223" text-anchor="middle">com fundamento</text><text x="750" y="250" text-anchor="middle" class="small">Realização externa à Mesa</text><rect x="580" y="330" width="345" height="100" class="box"/><text x="595" y="353" class="small">O02 | Instrumental direto | P01/P02</text><text x="595" y="380">Conferir correspondência</text><text x="595" y="405">entre caso e evidência</text><path d="M580 380 L530 380 L530 195 L542 195" class="edge"/><text x="585" y="318" class="small">instrumenta O06</text><rect x="580" y="470" width="345" height="100" class="box"/><text x="595" y="493" class="small">O07 | Instrumental direto | P01/P02</text><text x="595" y="520">Relacionar o achado</text><text x="595" y="545">com o contexto da carga</text><path d="M580 520 L537 520 L537 195 L542 195" class="edge"/><text x="585" y="458" class="small">instrumenta O06</text><rect x="580" y="610" width="345" height="100" class="box"/><text x="595" y="633" class="small">O08 | Instrumental direto | P01/P02</text><text x="595" y="660">Reconhecer limites e</text><text x="595" y="685">informação insuficiente</text><path d="M580 660 L544 660 L544 195 L542 195" class="edge"/><text x="585" y="598" class="small">instrumenta O06</text><rect x="580" y="780" width="345" height="90" class="box"/><text x="595" y="803" class="small">O04 | Instrumental direto | P01</text><text x="595" y="830">Descrever e localizar</text><text x="595" y="855">o achado observado</text><path d="M750 870 L750 925" class="edge"/><text x="760" y="900" class="small">instrumenta O05</text><rect x="580" y="925" width="345" height="105" class="box" stroke-dasharray="7 5"/><text x="595" y="950" class="small">O05 | Instrumental indireto | P01</text><text x="595" y="980">Comunicar conclusão rastreável</text><text x="595" y="1005">a quem decidirá</text><path d="M925 975 L970 975 L970 195 L958 195" class="edge" stroke-dasharray="7 5"/><text x="595" y="1060" class="small">O05 instrumenta indiretamente O06.</text><ellipse cx="1250" cy="195" rx="208" ry="75" class="box" stroke-dasharray="7 5"/><text x="1250" y="170" text-anchor="middle">O09 | Final | P03</text><text x="1250" y="198" text-anchor="middle">Esclarecer a suspeita</text><text x="1250" y="223" text-anchor="middle">na conferência física</text><text x="1250" y="250" text-anchor="middle" class="small">Realização externa à Mesa</text><rect x="1080" y="330" width="345" height="100" class="box"/><text x="1095" y="353" class="small">O02 | Instrumental direto | P01/P02</text><text x="1095" y="380">Conferir correspondência</text><text x="1095" y="405">entre caso e evidência</text><path d="M1080 380 L1030 380 L1030 195 L1042 195" class="edge"/><text x="1085" y="318" class="small">instrumenta O09</text><rect x="1080" y="470" width="345" height="100" class="box"/><text x="1095" y="493" class="small">O07 | Instrumental direto | P01/P02</text><text x="1095" y="520">Relacionar o achado</text><text x="1095" y="545">com o contexto da carga</text><path d="M1080 520 L1037 520 L1037 195 L1042 195" class="edge"/><text x="1085" y="458" class="small">instrumenta O09</text><rect x="1080" y="610" width="345" height="100" class="box"/><text x="1095" y="633" class="small">O08 | Instrumental direto | P01/P02</text><text x="1095" y="660">Reconhecer limites e</text><text x="1095" y="685">informação insuficiente</text><path d="M1080 660 L1044 660 L1044 195 L1042 195" class="edge"/><text x="1085" y="598" class="small">instrumenta O09</text><rect x="1080" y="780" width="345" height="90" class="box"/><text x="1095" y="803" class="small">O04 | Instrumental direto | P01</text><text x="1095" y="830">Descrever e localizar</text><text x="1095" y="855">o achado observado</text><path d="M1250 870 L1250 925" class="edge"/><text x="1260" y="900" class="small">instrumenta O05</text><rect x="1080" y="925" width="345" height="105" class="box" stroke-dasharray="7 5"/><text x="1095" y="950" class="small">O05 | Instrumental indireto | P01</text><text x="1095" y="980">Comunicar conclusão rastreável</text><text x="1095" y="1005">a quem decidirá</text><path d="M1425 975 L1470 975 L1470 195 L1458 195" class="edge" stroke-dasharray="7 5"/><text x="1095" y="1060" class="small">O05 instrumenta indiretamente O09.</text><text x="25" y="1140">Legenda: elipse = objetivo final; retângulo = instrumental direto; retângulo tracejado = instrumental indireto.</text><text x="25" y="1175">Elipses tracejadas: finais externos. O02/O07/O08 podem ser perseguidos por P01/P02 na preparação/leitura do parecer.</text><text x="25" y="1210">P03 é destinatário externo; não se cria interface própria. O mapa não representa sequência de telas nem decomposição de tarefas.</text><text x="25" y="1245">Fontes editáveis: este SVG e mapa_objetivos.mmd. Classificações e relações detalhadas no dicionário da Entrega 9.</text></svg>